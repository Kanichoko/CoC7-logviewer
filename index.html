<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoC7版ログ読み込み</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        coc: {
                            crit: '#10B981',
                            success: '#06B6D4',
                            failure: '#F59E0B',
                            fumble: '#EF4444',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

<div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center pb-6 mb-6 border-b border-slate-300 dark:border-slate-700 gap-4">
        <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                <i class="fa-solid fa-dice-d20"></i> CoC7版ログ読み込み
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="themeToggleBtn" class="p-2.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition" title="テーマ切り替え">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block"></i>
            </button>
            <button id="reloadFileBtn" class="hidden text-xs sm:text-sm px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition font-medium shadow-sm">
                <i class="fa-solid fa-file-arrow-up mr-1"></i> 別のログを開く
            </button>
        </div>
    </header>

    <!-- Upload Area -->
    <div id="uploadSection" class="max-w-xl mx-auto my-12 p-8 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 text-center">
        <div class="w-16 h-16 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fa-solid fa-file-code"></i>
        </div>
        <h2 class="text-xl font-bold mb-2">ココフォリアのログ（HTML）を読み込み</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">
            ※ファイルはサーバー等に送信されず、すべてお使いの端末内で安全に処理されます。
        </p>
        <label class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl cursor-pointer transition shadow-md hover:shadow-indigo-500/20">
            <i class="fa-solid fa-upload"></i> ファイルを選択する
            <input type="file" id="fileInput" accept=".html,.htm" class="hidden">
        </label>
    </div>

    <!-- Main Viewer Area -->
    <div id="viewerSection" class="hidden space-y-6">

        <!-- Individual Character Stats Dashboard (Hidden when ALL is selected) -->
        <div id="characterStatsContainer" class="hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-500"></i>
                    <span id="statsTitleLabel">人物統計</span>
                </h2>
            </div>

            <!-- Dynamic Metrics Cards for Selected Character -->
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">総発言数</div>
                    <div id="statTotalMsgs" class="text-xl sm:text-2xl font-black mt-1 text-slate-800 dark:text-slate-100">0</div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">ダイスロール数</div>
                    <div id="statTotalDice" class="text-xl sm:text-2xl font-black mt-1 text-slate-800 dark:text-slate-100">0</div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">✨ クリティカル</div>
                    <div id="statCrit" class="text-xl sm:text-2xl font-black mt-1 text-emerald-600 dark:text-emerald-400">0</div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-semibold text-cyan-600 dark:text-cyan-400">⭕ 成功</div>
                    <div id="statSuccess" class="text-xl sm:text-2xl font-black mt-1 text-cyan-600 dark:text-cyan-400">0</div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-semibold text-amber-600 dark:text-amber-400">❌ 失敗</div>
                    <div id="statFailure" class="text-xl sm:text-2xl font-black mt-1 text-amber-600 dark:text-amber-400">0</div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="text-xs font-semibold text-red-600 dark:text-red-400">💥 ファンブル</div>
                    <div id="statFumble" class="text-xl sm:text-2xl font-black mt-1 text-red-600 dark:text-red-400">0</div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-5">
            
            <!-- Search & Reset Control -->
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="発言本文やキャラクター名、ダイス結果からキーワード検索..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button id="resetFiltersBtn" class="px-4 py-2.5 text-xs sm:text-sm font-semibold bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-rotate-left"></i> 絞り込み解除
                </button>
            </div>

            <!-- Character Filter -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">
                    <i class="fa-solid fa-user mr-1"></i> 人物（キャラクター）選択
                </label>
                <div id="characterTabs" class="flex flex-wrap gap-1.5 custom-scrollbar max-h-32 overflow-y-auto pr-1"></div>
            </div>

            <!-- Skill Filter (Dynamic per character) -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 技能・ロール名選択
                        <span id="selectedCharLabel" class="text-indigo-500 font-normal normal-case ml-1"></span>
                    </label>
                </div>
                <div id="skillContainer" class="flex flex-wrap gap-1.5 custom-scrollbar max-h-36 overflow-y-auto pr-1"></div>
            </div>

            <!-- Result Type Filter -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">
                    <i class="fa-solid fa-bullseye mr-1"></i> 判定結果選択
                </label>
                <div id="resultTabs" class="flex flex-wrap gap-1.5">
                    <button data-type="all" class="result-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-indigo-600 text-white">すべて</button>
                    <button data-type="crit" class="result-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-slate-600">✨ 決定的成功/クリティカル</button>
                    <button data-type="success" class="result-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 dark:bg-slate-700 text-cyan-600 dark:text-cyan-400 hover:bg-cyan-50 dark:hover:bg-slate-600">⭕ 成功</button>
                    <button data-type="failure" class="result-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 dark:bg-slate-700 text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-slate-600">❌ 失敗</button>
                    <button data-type="fumble" class="result-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 dark:bg-slate-700 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-slate-600">💥 致命的失敗/ファンブル</button>
                    <button data-type="other" class="result-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600">💬 通常発言・その他</button>
                </div>
            </div>

        </div>

        <!-- Log List -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80">
                <span id="logCountLabel" class="text-xs font-bold text-slate-500 dark:text-slate-400">表示中: 0 件</span>
            </div>
            <div id="logContainer" class="divide-y divide-slate-100 dark:divide-slate-700/50 max-h-[70vh] overflow-y-auto custom-scrollbar p-2"></div>
        </div>

    </div>

</div>

<script>
// Data Store
let allParsedLogs = [];

// Filter State
let filterState = {
    character: 'ALL',
    resultType: 'all',
    skill: 'ALL',
    searchQuery: ''
};

// DOM References
const fileInput = document.getElementById('fileInput');
const uploadSection = document.getElementById('uploadSection');
const viewerSection = document.getElementById('viewerSection');
const reloadFileBtn = document.getElementById('reloadFileBtn');
const searchInput = document.getElementById('searchInput');
const resetFiltersBtn = document.getElementById('resetFiltersBtn');
const characterTabs = document.getElementById('characterTabs');
const resultTabs = document.getElementById('resultTabs');
const skillContainer = document.getElementById('skillContainer');
const selectedCharLabel = document.getElementById('selectedCharLabel');
const logContainer = document.getElementById('logContainer');
const logCountLabel = document.getElementById('logCountLabel');

// Dark/Light Theme Toggle
document.getElementById('themeToggleBtn').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
});

// Change File
reloadFileBtn.addEventListener('click', () => {
    uploadSection.classList.remove('hidden');
    viewerSection.classList.add('hidden');
    reloadFileBtn.classList.add('hidden');
    fileInput.value = '';
});

// File Loader
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (evt) => parseCcfoliaHtml(evt.target.result);
    reader.readAsText(file);
});

// Parsing HTML Log
function parseCcfoliaHtml(htmlStr) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlStr, 'text/html');
    const paragraphs = doc.querySelectorAll('p');

    allParsedLogs = [];

    paragraphs.forEach((p, index) => {
        const spans = p.querySelectorAll('span');
        if (spans.length >= 3) {
            const channel = spans[0].textContent.trim();
            const name = spans[1].textContent.trim() || "不明";
            
            let contentHtml = Array.from(spans).slice(2).map(s => s.innerHTML).join(' : ');
            contentHtml = contentHtml.replace(/^:\s*/, '');

            const fullText = p.textContent;

            // Result Detection
            let resultType = 'other';
            if (fullText.includes('決定的成功') || fullText.includes('クリティカル')) {
                resultType = 'crit';
            } else if (fullText.includes('致命的失敗') || fullText.includes('ファンブル')) {
                resultType = 'fumble';
            } else if (fullText.includes('成功')) {
                resultType = 'success';
            } else if (fullText.includes('失敗')) {
                resultType = 'failure';
            }

            // Skill Detection
            let detectedSkill = null;
            const skillMatch = fullText.match(/【([^】]+)】/);
            if (skillMatch && skillMatch[1]) {
                detectedSkill = skillMatch[1].trim();
            }

            allParsedLogs.push({
                id: index,
                channel: channel,
                name: name,
                contentHtml: contentHtml,
                fullText: fullText,
                resultType: resultType,
                skill: detectedSkill
            });
        }
    });

    if (allParsedLogs.length === 0) {
        alert('有効なログデータを見つけられませんでした。ココフォリアのHTMLファイルをご使用ください。');
        return;
    }

    uploadSection.classList.add('hidden');
    viewerSection.classList.remove('hidden');
    reloadFileBtn.classList.remove('hidden');

    filterState = { character: 'ALL', resultType: 'all', skill: 'ALL', searchQuery: '' };
    searchInput.value = '';

    updateStatsDashboard();
    buildCharacterTabs();
    buildSkillTabs();
    renderLogs();
}

// Compute Character Map Data
function getCharacterStatsMap() {
    const map = new Map();

    allParsedLogs.forEach(log => {
        if (!map.has(log.name)) {
            map.set(log.name, {
                totalMsgs: 0,
                totalDice: 0,
                crit: 0,
                success: 0,
                failure: 0,
                fumble: 0,
                skills: new Map()
            });
        }
        const stats = map.get(log.name);
        stats.totalMsgs++;

        if (log.resultType !== 'other') {
            stats.totalDice++;
            stats[log.resultType]++;
        }

        if (log.skill) {
            stats.skills.set(log.skill, (stats.skills.get(log.skill) || 0) + 1);
        }
    });

    return map;
}

// Update Dashboard Numbers (Shows only when an individual character is selected)
function updateStatsDashboard() {
    const characterStatsContainer = document.getElementById('characterStatsContainer');
    const statsTitleLabel = document.getElementById('statsTitleLabel');

    if (filterState.character === 'ALL') {
        characterStatsContainer.classList.add('hidden');
    } else {
        characterStatsContainer.classList.remove('hidden');
        statsTitleLabel.textContent = `人物統計: ${filterState.character}`;

        const charStatsMap = getCharacterStatsMap();
        const stats = charStatsMap.get(filterState.character) || { totalMsgs: 0, totalDice: 0, crit: 0, success: 0, failure: 0, fumble: 0 };

        document.getElementById('statTotalMsgs').textContent = stats.totalMsgs.toLocaleString();
        document.getElementById('statTotalDice').textContent = stats.totalDice.toLocaleString();
        document.getElementById('statCrit').textContent = stats.crit;
        document.getElementById('statSuccess').textContent = stats.success;
        document.getElementById('statFailure').textContent = stats.failure;
        document.getElementById('statFumble').textContent = stats.fumble;
    }
}

function selectCharacter(charName) {
    filterState.character = charName;
    filterState.skill = 'ALL';
    buildCharacterTabs();
    buildSkillTabs();
    updateStatsDashboard();
    renderLogs();
}

// Build Character Selection Buttons
function buildCharacterTabs() {
    characterTabs.innerHTML = '';
    const charCounts = { 'ALL': allParsedLogs.length };

    allParsedLogs.forEach(l => {
        charCounts[l.name] = (charCounts[l.name] || 0) + 1;
    });

    const uniqueNames = ['ALL', ...Object.keys(charCounts).filter(n => n !== 'ALL').sort()];

    uniqueNames.forEach(name => {
        const btn = document.createElement('button');
        const isActive = filterState.character === name;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
            isActive 
            ? 'bg-indigo-600 text-white shadow-sm' 
            : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
        }`;
        
        btn.innerHTML = `<span>${escapeHtml(name === 'ALL' ? '全員表示' : name)}</span> <span class="opacity-60 text-[10px]">(${charCounts[name]})</span>`;
        btn.onclick = () => selectCharacter(name);
        characterTabs.appendChild(btn);
    });
}

// Build Dynamic Skill Filters
function buildSkillTabs() {
    skillContainer.innerHTML = '';

    if (filterState.character === 'ALL') {
        selectedCharLabel.textContent = '(全体)';
    } else {
        selectedCharLabel.textContent = `(${filterState.character})`;
    }

    const relevantLogs = filterState.character === 'ALL' 
        ? allParsedLogs 
        : allParsedLogs.filter(l => l.name === filterState.character);

    const characterSkillsMap = new Map();
    relevantLogs.forEach(log => {
        if (log.skill) {
            characterSkillsMap.set(log.skill, (characterSkillsMap.get(log.skill) || 0) + 1);
        }
    });

    const allBtn = document.createElement('button');
    const isAllActive = filterState.skill === 'ALL';
    allBtn.className = `px-2.5 py-1 rounded-md text-xs font-semibold transition ${
        isAllActive 
        ? 'bg-indigo-600 text-white' 
        : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
    }`;
    allBtn.textContent = `すべての技能 (${characterSkillsMap.size}種)`;
    allBtn.onclick = () => {
        filterState.skill = 'ALL';
        buildSkillTabs();
        renderLogs();
    };
    skillContainer.appendChild(allBtn);

    if (characterSkillsMap.size === 0) {
        const noSkillMsg = document.createElement('span');
        noSkillMsg.className = 'text-xs text-slate-400 dark:text-slate-500 py-1 italic';
        noSkillMsg.textContent = '※該当する技能ログはありません';
        skillContainer.appendChild(noSkillMsg);
        return;
    }

    const sortedSkills = Array.from(characterSkillsMap.entries()).sort((a, b) => b[1] - a[1]);

    sortedSkills.forEach(([skillName, count]) => {
        const btn = document.createElement('button');
        const isActive = filterState.skill === skillName;
        btn.className = `px-2.5 py-1 rounded-md text-xs font-semibold transition flex items-center gap-1 ${
            isActive 
            ? 'bg-indigo-600 text-white' 
            : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
        }`;
        btn.innerHTML = `<span>【${escapeHtml(skillName)}】</span><span class="opacity-60 text-[10px]">${count}</span>`;
        btn.onclick = () => {
            filterState.skill = skillName;
            buildSkillTabs();
            renderLogs();
        };
        skillContainer.appendChild(btn);
    });
}

// Result Filter Switcher
resultTabs.querySelectorAll('.result-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-type');
        filterState.resultType = type;

        resultTabs.querySelectorAll('.result-btn').forEach(b => {
            b.classList.remove('bg-indigo-600', 'text-white');
            b.classList.add('bg-slate-100', 'dark:bg-slate-700');
        });
        btn.classList.remove('bg-slate-100', 'dark:bg-slate-700');
        btn.classList.add('bg-indigo-600', 'text-white');

        renderLogs();
    });
});

// Search Filter
searchInput.addEventListener('input', (e) => {
    filterState.searchQuery = e.target.value.toLowerCase().trim();
    renderLogs();
});

// Reset
resetFiltersBtn.addEventListener('click', () => {
    filterState = { character: 'ALL', resultType: 'all', skill: 'ALL', searchQuery: '' };
    searchInput.value = '';
    
    resultTabs.querySelectorAll('.result-btn').forEach((b, idx) => {
        if (idx === 0) {
            b.classList.add('bg-indigo-600', 'text-white');
        } else {
            b.classList.remove('bg-indigo-600', 'text-white');
            b.classList.add('bg-slate-100', 'dark:bg-slate-700');
        }
    });

    buildCharacterTabs();
    buildSkillTabs();
    updateStatsDashboard();
    renderLogs();
});

// Render Log Feed
function renderLogs() {
    logContainer.innerHTML = '';

    const filtered = allParsedLogs.filter(log => {
        if (filterState.character !== 'ALL' && log.name !== filterState.character) return false;
        if (filterState.resultType !== 'all' && log.resultType !== filterState.resultType) return false;
        if (filterState.skill !== 'ALL' && log.skill !== filterState.skill) return false;

        if (filterState.searchQuery !== '') {
            const query = filterState.searchQuery;
            if (!log.fullText.toLowerCase().includes(query)) return false;
        }

        return true;
    });

    logCountLabel.textContent = `表示中: ${filtered.length.toLocaleString()} / ${allParsedLogs.length.toLocaleString()} 件`;

    if (filtered.length === 0) {
        logContainer.innerHTML = `
            <div class="text-center py-12 text-slate-400 dark:text-slate-500">
                <i class="fa-solid fa-ghost text-3xl mb-2"></i>
                <p class="text-sm">条件に該当するログは見つかりませんでした。</p>
            </div>
        `;
        return;
    }

    const fragment = document.createDocumentFragment();

    filtered.forEach(log => {
        const item = document.createElement('div');
        item.className = "py-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition flex items-start justify-between gap-3 text-sm";

        let badgeHtml = '';
        if (log.resultType === 'crit') {
            badgeHtml = `<span class="shrink-0 px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">✨ 決定的成功</span>`;
        } else if (log.resultType === 'fumble') {
            badgeHtml = `<span class="shrink-0 px-2 py-0.5 rounded text-xs font-bold bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300 border border-red-300 dark:border-red-800">💥 致命的失敗</span>`;
        } else if (log.resultType === 'success') {
            badgeHtml = `<span class="shrink-0 px-2 py-0.5 rounded text-xs font-bold bg-cyan-100 dark:bg-cyan-950 text-cyan-700 dark:text-cyan-300 border border-cyan-300 dark:border-cyan-800">⭕ 成功</span>`;
        } else if (log.resultType === 'failure') {
            badgeHtml = `<span class="shrink-0 px-2 py-0.5 rounded text-xs font-bold bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 border border-amber-300 dark:border-amber-800">❌ 失敗</span>`;
        }

        item.innerHTML = `
            <div class="space-y-1 min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${escapeHtml(log.channel)}</span>
                    <span class="font-bold text-indigo-600 dark:text-indigo-400 cursor-pointer hover:underline" onclick="selectCharacter('${escapeHtml(log.name)}')">${escapeHtml(log.name)}</span>
                    ${log.skill ? `<span class="text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-700">【${escapeHtml(log.skill)}】</span>` : ''}
                </div>
                <div class="text-slate-700 dark:text-slate-200 leading-relaxed break-words">${log.contentHtml}</div>
            </div>
            ${badgeHtml}
        `;
        fragment.appendChild(item);
    });

    logContainer.appendChild(fragment);
}

function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}
</script>
